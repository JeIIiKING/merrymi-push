<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메리미 · 알림 관리자</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style.css">
  <style> main { max-width: 820px; } .scroll { overflow-x: auto; } td.t { white-space: nowrap; } </style>
</head>
<body>
<main>
  <h1>🎙️ 알림 관리자</h1>
  <p class="sub">서버 시각(KST) <b id="kst">-</b> · 10초마다 자동 새로고침</p>

  <section id="login" class="card">
    <label for="key">관리자 키</label>
    <input id="key" type="password" placeholder="ADMIN_KEY">
    <button class="primary" id="btnLogin">들어가기</button>
  </section>

  <div id="app" class="hidden">
    <!-- 즉시 발송 -->
    <section class="card">
      <h2>즉시 발송</h2>
      <label>제목</label><input id="title" value="🔴 ON AIR">
      <label>내용</label><input id="body" value="오늘 밤 방송이 시작됐어요. 지금 입장하세요!">
      <label>대상</label>
      <select id="target"><option value="">구독한 기기 전체</option></select>
      <button class="primary" id="btnSend">📣 ON AIR 테스트 알림 보내기</button>
    </section>

    <!-- 매일 예약 -->
    <section class="card">
      <h2>매일 예약 발송 (방송 알림)</h2>
      <div class="row">
        <div><label>시각 (KST)</label><input id="scTime" type="time" value="21:00"></div>
        <div><label>사용</label><select id="scEnabled"><option value="true">켜짐</option><option value="false">꺼짐</option></select></div>
      </div>
      <label>제목</label><input id="scTitle">
      <label>내용</label><input id="scBody">
      <p class="small" id="scInfo"></p>
      <button class="primary" id="btnSchedule">저장</button>
    </section>

    <!-- 1회 예약 -->
    <section class="card">
      <h2>1회 예약 테스트</h2>
      <p class="small" style="margin-top:0">9시까지 기다리지 않고 예약 발송이 정시에 도착하는지 확인할 때 쓰세요.</p>
      <div class="row">
        <button class="ghost" data-min="2">2분 뒤</button>
        <button class="ghost" data-min="5">5분 뒤</button>
        <button class="ghost" data-min="10">10분 뒤</button>
      </div>
      <p class="small" id="osInfo"></p>
      <button class="danger hidden" id="btnCancelOs">1회 예약 취소</button>
    </section>

    <!-- 기기 목록 -->
    <section class="card">
      <h2>구독 기기 <span id="subCount" class="small"></span></h2>
      <div class="scroll"><table>
        <thead><tr><th>이름</th><th>환경</th><th>푸시 서버</th><th>최근 결과</th><th></th></tr></thead>
        <tbody id="subs"></tbody>
      </table></div>
    </section>

    <!-- 발송 기록 -->
    <section class="card">
      <h2>발송 기록 · 도착 확인</h2>
      <p class="small" style="margin-top:0">도착 = 기기의 서비스 워커가 알림을 받고 서버에 보고한 시각. 지연 = 도착 − 예정(또는 발송) 시각.</p>
      <div id="logs"></div>
      <button class="danger" id="btnClearLogs">기록 지우기</button>
    </section>
  </div>
</main>
<div id="toast" class="toast hidden"></div>
<script>
const $ = (id) => document.getElementById(id);
let KEY = localStorage.getItem('mm_admin') || '';
let state = null;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 3000); }
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const fmt = (iso) => iso ? new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '-';
const secs = (a, b) => ((new Date(a) - new Date(b)) / 1000);
const fmtDelay = (s) => s < 60 ? `${s.toFixed(1)}초` : `${Math.floor(s / 60)}분 ${Math.round(s % 60)}초`;
const KIND = { manual: '즉시', scheduled: '매일 예약', oneshot: '1회 예약', self: '셀프' };

async function load(first) {
  try {
    state = await api('/api/admin/state');
  } catch (e) {
    if (first !== undefined) toast(e.message);
    $('login').classList.remove('hidden'); $('app').classList.add('hidden');
    return;
  }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('kst').textContent = state.kst;
  const subName = Object.fromEntries(state.subs.map((s) => [s.id, s.label]));

  // 대상 선택
  const sel = $('target'), cur = sel.value;
  sel.innerHTML = '<option value="">구독한 기기 전체</option>' + state.subs.map((s) => `<option value="${s.id}">${esc(s.label)}</option>`).join('');
  sel.value = cur;

  // 예약 폼 (처음 한 번만 채움 — 입력 중 덮어쓰기 방지)
  if (first) {
    $('scTime').value = state.schedule.time; $('scEnabled').value = String(state.schedule.enabled);
    $('scTitle').value = state.schedule.title; $('scBody').value = state.schedule.body;
  }
  $('scInfo').textContent = state.schedule.enabled
    ? `매일 ${state.schedule.time} 발송 · 마지막 발송일 ${state.schedule.lastSentDate || '없음'}`
    : '꺼져 있음';
  $('osInfo').textContent = state.oneShot ? `예약됨: ${fmt(state.oneShot.at)}` : '예약 없음';
  $('btnCancelOs').classList.toggle('hidden', !state.oneShot);

  // 기기
  $('subCount').textContent = `(${state.subs.length})`;
  $('subs').innerHTML = state.subs.map((s) => `<tr>
      <td><b>${esc(s.label)}</b><div class="small">${fmt(s.createdAt)}</div></td>
      <td>${esc(s.platform)} · ${esc(s.browser)}<br><span class="tag ${s.standalone ? 'ok' : ''}">${s.standalone ? '홈 화면 앱' : '브라우저'}</span></td>
      <td class="small">${esc(s.pushService)}</td>
      <td>${s.lastStatus ? `<span class="tag ${s.lastStatus.startsWith('OK') ? 'ok' : 'no'}">${esc(s.lastStatus)}</span><div class="small">${fmt(s.lastStatusAt)}</div>` : '-'}</td>
      <td><button class="danger" style="padding:6px 10px;margin:0;font-size:13px" onclick="removeSub('${s.id}')">삭제</button></td>
    </tr>`).join('') || '<tr><td colspan="5" class="small">아직 구독한 기기가 없어요</td></tr>';

  // 기록
  $('logs').innerHTML = state.logs.map((l) => {
    const base = l.scheduledFor || l.sentAt;
    const ids = Object.keys(l.results);
    const rows = ids.map((id) => {
      const r = l.results[id], a = l.acks[id] || {};
      const sentOk = r.status >= 200 && r.status < 300;
      const recv = a.receivedAt ? `<span class="tag ok">도착</span> ${fmt(a.receivedAt)} <b>(${fmtDelay(secs(a.receivedAt, base))})</b>` : (sentOk ? '<span class="tag wait">대기/미확인</span>' : '-');
      return `<tr>
        <td>${esc(subName[id] || id)}</td>
        <td>${sentOk ? `<span class="tag ok">${r.status}</span>` : `<span class="tag no">${r.status || 'ERR'}</span><div class="small">${esc(r.error || '')}</div>`}</td>
        <td class="t">${recv}</td>
        <td class="t">${a.clickedAt ? `<span class="tag ok">탭함</span> ${fmt(a.clickedAt)}` : '-'}</td>
      </tr>`;
    }).join('');
    return `<div style="margin:0 0 16px">
      <div><span class="tag">${KIND[l.kind] || l.kind}</span> <b>${esc(l.title)}</b></div>
      <div class="small">${l.scheduledFor ? `예정 ${fmt(l.scheduledFor)} · ` : ''}발송 ${fmt(l.sentAt)}${l.scheduledFor ? ` (서버 지연 ${fmtDelay(Math.max(0, secs(l.sentAt, l.scheduledFor)))})` : ''} · 대상 ${ids.length}대</div>
      <div class="scroll"><table><thead><tr><th>기기</th><th>푸시서버 응답</th><th>기기 도착</th><th>알림 탭</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="small">대상 없음</td></tr>'}</tbody></table></div>
    </div>`;
  }).join('') || '<p class="small">아직 발송 기록이 없어요</p>';
}

window.removeSub = async (id) => { if (!confirm('이 기기 구독을 삭제할까요?')) return; await api('/api/admin/remove', { id }); load(); };

$('btnLogin').onclick = () => { KEY = $('key').value.trim(); localStorage.setItem('mm_admin', KEY); load(true); };
$('btnSend').onclick = async () => {
  const t = $('target').value;
  try {
    const { log } = await api('/api/admin/send', { title: $('title').value, body: $('body').value, targetIds: t ? [t] : [] });
    const ok = Object.values(log.results).filter((r) => r.status >= 200 && r.status < 300).length;
    toast(`보냄: ${ok}/${Object.keys(log.results).length}대 푸시 서버 접수`);
  } catch (e) { toast('실패: ' + e.message); }
  load();
};
$('btnSchedule').onclick = async () => {
  try {
    await api('/api/admin/schedule', { time: $('scTime').value, enabled: $('scEnabled').value === 'true', title: $('scTitle').value, body: $('scBody').value });
    toast('예약 저장됨');
  } catch (e) { toast('실패: ' + e.message); }
  load();
};
document.querySelectorAll('[data-min]').forEach((b) => b.onclick = async () => {
  try { await api('/api/admin/oneshot', { minutes: Number(b.dataset.min) }); toast(`${b.dataset.min}분 뒤 정각(초 0)에 발송 예약`); } catch (e) { toast(e.message); }
  load();
});
$('btnCancelOs').onclick = async () => { await api('/api/admin/oneshot', { cancel: true }); load(); };
$('btnClearLogs').onclick = async () => { if (!confirm('발송 기록을 모두 지울까요?')) return; await api('/api/admin/clear-logs', {}); load(); };

if (KEY) load(true);
setInterval(() => { if (KEY && !document.hidden) load(); }, 10000);
</script>
</body>
</html>
